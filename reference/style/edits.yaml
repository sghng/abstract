32:
  project: q-matrix
  section: introduction
  before: >-
    Various CDMs have been developed that utilize the Q-matrix in different
    ways, including the DINA (Deterministic Input, Noisy "And" Gate) model
    <cite>, which assumes a conjunctive relationship among required attributes,
    and its extensions that accommodate different attribute interaction
    structures.
  after: >-
    The development of CDMs represents a shift [...] Early conceptual
    foundations emerged in the 1980s with the Rule Space Method proposed by
    Tatsuoka <cite> [...] researchers developed statistical models to
    operationalize cognitive diagnosis, including the DINA model <cite> [...]
    the framework has expanded to more flexible models such as the G-DINA model
    <cite>.
  lesson: >-
    Trace the framework from its founding technique through each generalization,
    citing the origin of every step.
33:
  project: q-matrix
  section: introduction
  before: >-
    This process is fraught with difficulties: experts frequently disagree on
    attribute requirements <cite>, particularly when skills are ambiguous or
    overlapping; the process is time-consuming and expensive, especially for
    large item banks; and the resulting Q-matrices may be susceptible to
    systematic biases [...]
  after: >-
    Empirical studies have shown that experts frequently disagree on attribute
    specifications, particularly when skills are abstract, overlapping, or
    ambiguously defined <cite>. Moreover, the manual annotation process is
    time-consuming and costly [...]. Even when expert panels are carefully
    assembled, the resulting Q-matrices may reflect systematic biases [...],
    which can ultimately affect model identification and diagnostic accuracy.
  lesson: >-
    Give each documented difficulty its own sentence, opened by the studies that
    established it, closed by its downstream consequence.
34:
  project: q-matrix
  section: introduction
  before: >-
    These challenges are amplified in the modern context of continuous
    assessment development, where item banks are constantly expanded and revised
    to meet evolving curriculum standards, combat item exposure, and support
    adaptive testing systems. [...] This situation calls for automated or
    semi-automated approaches [...]
  after: >-
    These challenges have become increasingly salient with the rapid growth of
    large-scale digital assessment systems, automated item generation (AIG), and
    adaptive testing platforms. Automated item generation techniques enable the
    rapid production of large numbers of assessment items from cognitive
    templates <cite> [...] In such environments, the scalability and reliability
    of Q-matrix development become critical bottlenecks [...]
  lesson: >-
    Ground each amplifying force in a named, cited practice of the field.
35:
  project: q-matrix
  section: introduction
  before: >-
    Their potential for Q-matrix prediction is intriguing: can these models
    leverage their broad world knowledge and reasoning capabilities to identify
    the cognitive attributes required for assessment items?
  after: >-
    The core assumption is that item wording contains systematic signals about
    the cognitive processes required for problem solving. If items associated
    with the same attributes exhibit similar semantic patterns, then models
    capable of capturing these patterns may approximate expert Q-matrix
    judgments with reasonable accuracy.
  lesson: >-
    State the study's core assumption as an explicit conditional, not as an
    intriguing open question.
36:
  project: q-matrix
  section: introduction
